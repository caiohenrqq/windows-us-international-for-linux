name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed gcc make pkgconf python fcitx5 libxkbcommon xkeyboard-config
      - name: Create test user
        run: |
          useradd --create-home testuser
          chown --recursive testuser:testuser "$GITHUB_WORKSPACE"
      - name: Build and test
        run: runuser -u testuser -- make check check-sanitizers
